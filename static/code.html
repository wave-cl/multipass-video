<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>multipass</title>
<style>
  /* Written for the oldest Chromium a TV browser still ships: no `inset`,
     no flex `gap`, no `clamp()`. */
  html,body{margin:0;height:100%;background:#000;color:#eee;font:15px system-ui,sans-serif;overflow:hidden}
  #video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
  #controls{position:absolute;left:12px;top:12px;transition:opacity .3s;z-index:3}
  #controls button{background:rgba(255,255,255,.9);margin-right:8px}
  button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#fff;color:#000;cursor:pointer}
  #hud{position:absolute;right:12px;bottom:12px;font:12px ui-monospace,Menlo,monospace;opacity:.45;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;white-space:pre;transition:opacity .3s}
  body.idle #controls,body.idle #hud{opacity:0;pointer-events:none}
  body.idle{cursor:none}
  .hidden{display:none!important}

  /* The keypad: big enough to read from a sofa and to hit with a thumb. */
  #pad{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
  #pad h1{margin:0 0 18px;font-size:24px;font-weight:600;letter-spacing:.04em}
  #digits{margin-bottom:14px}
  #digits span{display:inline-block;width:46px;height:62px;line-height:62px;margin:0 5px;
    font:600 34px/62px ui-monospace,Menlo,monospace;background:#161616;border:2px solid #333;border-radius:10px}
  #digits span.set{border-color:#888;background:#1f1f1f}
  #msg{min-height:1.5em;margin-bottom:14px;opacity:.8}
  #msg.bad{color:#f66;opacity:1}
  #keys{width:268px}
  #keys button{width:78px;height:62px;margin:5px;font-size:26px;font-weight:600;background:#1b1b1b;color:#eee;border:2px solid #2d2d2d}
  #keys button:focus{outline:none;border-color:#fff;background:#2a2a2a}
  #keys button:active{background:#3a3a3a}
  @media (min-width:1600px){
    html,body{font-size:20px}
    #pad h1{font-size:40px}
    #digits span{width:72px;height:96px;font-size:52px;line-height:96px}
    #keys{width:420px}
    #keys button{width:124px;height:96px;font-size:40px}
    #hud{font-size:20px}
  }
</style>
</head>
<body>
<video id="video" playsinline preload="auto"></video>
<div id="controls">
  <button id="fullscreen">Fullscreen</button>
  <button id="unmute" class="hidden">Unmute</button>
  <button id="again" class="hidden">New code</button>
</div>
<div id="pad">
  <h1>Enter a code</h1>
  <div id="digits"></div>
  <div id="msg">Five digits</div>
  <div id="keys"></div>
</div>
<div id="hud"></div>
<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
var video = $('video');
var entered = '', busy = false;

// --- the keypad -----------------------------------------------------------
// Real buttons, so a TV remote's arrow keys move between them and OK
// presses them, without this page knowing anything about remotes.
(function () {
  for (var i = 0; i < 5; i++) $('digits').appendChild(document.createElement('span'));
  var order = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0'];
  order.forEach(function (label) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.onclick = function () { press(label); };
    $('keys').appendChild(b);
  });
  renderDigits();
})();

function renderDigits() {
  var boxes = $('digits').children;
  for (var i = 0; i < boxes.length; i++) {
    boxes[i].textContent = entered.charAt(i) || '';
    boxes[i].className = entered.charAt(i) ? 'set' : '';
  }
}

function press(key) {
  if (busy) return;
  if (key === '⌫') { entered = entered.slice(0, -1); say('Five digits'); }
  else if (/^[0-9]$/.test(key) && entered.length < 5) entered += key;
  renderDigits();
  if (entered.length === 5) submit();
}

function say(text, bad) {
  $('msg').textContent = text;
  $('msg').className = bad ? 'bad' : '';
}

document.addEventListener('keydown', function (e) {
  if ($('pad').classList.contains('hidden')) return;
  if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { press('⌫'); e.preventDefault(); }
});

// --- playing what the code asks for --------------------------------------
function submit() {
  busy = true;
  say('Looking…');
  fetch('/api/code/' + encodeURIComponent(entered))
    .then(function (r) {
      if (!r.ok) throw new Error(r.status === 404 ? 'No such code' : 'Could not reach the server');
      return r.json();
    })
    .then(function (found) {
      busy = false; entered = ''; renderDigits();
      play(found.file);
    })
    .catch(function (e) {
      busy = false; entered = ''; renderDigits();
      say(e.message, true);
    });
}

function play(file) {
  $('pad').classList.add('hidden');
  $('again').classList.remove('hidden');
  video.src = '/media/' + encodeURIComponent(file);
  video.load();
  video.play().catch(function () {
    // No sound without a gesture on some browsers; the keypad press is
    // usually one, but fall back to muted rather than to nothing.
    video.muted = true;
    video.play().catch(function () {});
  });
  poke();
}

function showPad() {
  video.pause();
  video.removeAttribute('src');
  video.load();
  $('pad').classList.remove('hidden');
  $('again').classList.add('hidden');
  entered = ''; renderDigits();
  say('Five digits');
  document.body.classList.remove('idle');
  var first = $('keys').firstChild;
  if (first && first.focus) first.focus();
}

video.addEventListener('ended', showPad);
video.addEventListener('error', function () {
  if (!video.getAttribute('src')) return;
  showPad();
  say('That file would not play', true);
});
$('again').onclick = showPad;

// --- the same controls as the stream -------------------------------------
function toggleFullscreen() {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
}
$('fullscreen').onclick = toggleFullscreen;
video.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', function () {
  $('fullscreen').textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  poke();
});
$('unmute').onclick = function () { video.muted = false; };

var idleTimer;
function poke() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function () {
    if (document.fullscreenElement && !video.paused) document.body.classList.add('idle');
  }, 3000);
}
['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(function (ev) {
  document.addEventListener(ev, poke, {passive: true});
});
poke();

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  return h ? h + ':' + p2(m) + ':' + p2(sec) : m + ':' + p2(sec);
}
setInterval(function () {
  $('unmute').classList.toggle('hidden', !(video.muted && !video.paused));
  $('hud').textContent = $('pad').classList.contains('hidden') && !isNaN(video.duration)
    ? fmt(video.currentTime) + ' / ' + fmt(video.duration)
    : '';
}, 250);
</script>
</body>
</html>
