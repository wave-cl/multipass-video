<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>multipass</title>
<style>
  /* Written for the oldest Chromium a TV browser still ships: no `inset`,
     no flex `gap`, no `clamp()`. */
  html,body{margin:0;height:100%;background:#000;color:#eee;font:15px system-ui,sans-serif;overflow:hidden}
  #video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
  #overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.65);text-align:center;padding:16px}
  #overlay h1{font-size:28px;font-weight:600;margin:0 0 14px}
  /* Intermission card: an 80s public-access "please stand by" -- colour
     bars, scanlines, chroma-fringed chunky type, a CRT vignette. All CSS. */
  #intermission{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#000;font-family:Impact,"Arial Black","Helvetica Neue",Arial,sans-serif}
  #intermission .bars{position:absolute;top:0;left:0;right:0;bottom:0;
    background:linear-gradient(90deg,#c0c0c0 0 14.28%,#c0c000 0 28.57%,#00c0c0 0 42.85%,#00c000 0 57.14%,#c000c0 0 71.42%,#c00000 0 85.71%,#0000c0 0 100%);
    filter:saturate(1.3) contrast(1.05)}
  #intermission .bars:after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;
    background:linear-gradient(90deg,#0000c0 0 14.28%,#131313 0 28.57%,#c000c0 0 42.85%,#131313 0 57.14%,#00c0c0 0 71.42%,#131313 0 85.71%,#c0c0c0 0 100%)}
  #intermission .band{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:5vh 0;text-align:center;
    background:rgba(0,0,40,.82);border-top:6px solid #fff;border-bottom:6px solid #fff;box-shadow:0 0 0 6px #000 inset}
  #intermission h1{margin:0;font-size:8vw;line-height:1.05;font-weight:900;letter-spacing:.05em;color:#ffe83d;
    text-shadow:-3px 0 rgba(255,0,60,.85),3px 0 rgba(0,255,255,.85),6px 6px 0 #000,0 0 30px rgba(255,232,61,.35);
    animation:jitter 7s steps(1,end) infinite}
  #intermission .scan{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,rgba(0,0,0,0) 2px 4px)}
  #intermission .vig{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
  #intermission .noise{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:.10;mix-blend-mode:screen}
  #intermission .roll{position:absolute;left:0;right:0;height:14%;top:-14%;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.10) 50%,rgba(255,255,255,0));animation:roll 11s linear infinite}
  @keyframes roll{to{top:114%}}
  @keyframes jitter{0%,96%,100%{transform:none}97%{transform:translateX(3px) skewX(-2deg)}98%{transform:translateX(-2px)}}
  @media (max-width:700px){#intermission h1{font-size:12vw}}
  #overlay p{margin:0 0 14px;opacity:.75;font-variant-numeric:tabular-nums}
  button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#fff;color:#000;cursor:pointer}
  #controls{position:absolute;left:12px;top:12px;transition:opacity .3s}
  #controls button{background:rgba(255,255,255,.9);margin-right:8px}
  #hud{position:absolute;right:12px;bottom:12px;font:12px ui-monospace,Menlo,monospace;opacity:.45;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;white-space:pre;transition:opacity .3s}
  @media (min-width:1600px){#hud{font-size:22px}#overlay h1{font-size:44px}#overlay p,button{font-size:22px}}
  /* Idle in fullscreen: nothing but the picture. */
  body.idle #controls,body.idle #hud{opacity:0;pointer-events:none}
  body.idle{cursor:none}
  .hidden{display:none!important}
</style>
</head>
<body>
<video id="video" playsinline preload="auto"></video>
<audio id="music" loop preload="auto"></audio>
<div id="intermission" class="hidden">
  <div class="bars"></div>
  <svg class="noise" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="band"><h1>We'll be right back</h1></div>
  <div class="roll"></div>
  <div class="scan"></div>
  <div class="vig"></div>
</div>
<div id="overlay"><h1 id="title">Connecting…</h1><p id="sub"></p><button id="join" class="hidden">Join</button></div>
<div id="controls"><button id="fullscreen">Fullscreen</button><button id="unmute" class="hidden">Unmute</button></div>
<div id="hud"></div>
<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
var video = $('video');
var music = $('music');

// The intermission music is fetched whole at load and kept as a local
// blob, so an intermission starts the instant it is called, not after a
// download. The card itself is CSS; there is nothing else to fetch.
fetch('/intermission-audio').then(function (r) { return r.blob(); })
  .then(function (b) { music.src = URL.createObjectURL(b); music.load(); })
  .catch(function () { music.src = '/intermission-audio'; });

// --- what the server says -------------------------------------------------
var schedule = null;      // {file, start_ms, loop} or null
var intermission = null;  // when it began (server ms), or null
var version = -1;
var loadedFile = null;    // what the video element holds
var duration = NaN;       // of the loaded file, seconds
var loadError = false;

// --- clock ----------------------------------------------------------------
// offset = server clock − local clock, in ms, from the lowest-RTT sample of
// each round; the round's RTT is shown in the HUD so a bad estimate is visible.
var offset = 0, offsetRtt = NaN;
function serverNow() { return Date.now() + offset; }

function sample() {
  var t0 = Date.now();
  return fetch('/api/state', {cache: 'no-store'})
    .then(function (r) { if (r.status === 401) location.href = '/login'; return r.json(); })
    .then(function (s) { return {s: s, t0: t0, rtt: Date.now() - t0}; })
    .catch(function () { return null; });
}
function syncClock() {
  var got = [];
  function finish() {
    if (!got.length) return;
    var best = got.reduce(function (a, b) { return b.rtt < a.rtt ? b : a; });
    offset = best.s.server_now_ms - (best.t0 + best.rtt / 2);
    offsetRtt = best.rtt;
    apply(got[got.length - 1].s);
  }
  (function next(i) {
    if (i >= 3) return finish();
    sample().then(function (x) { if (x) got.push(x); next(i + 1); });
  })(0);
}

// --- trace ----------------------------------------------------------------
// Opened with ?trace, the viewer reports what its player does to the
// server's log, so a TV can be read from wherever the server is. TV
// browsers trace without being asked: they are the ones that differ, and
// typing a query string on a remote is the step that never happens.
var TRACE = /[?&]trace/.test(location.search) || /Tizen|SMART-TV|SmartTV|Web0S|NetCast|VIDAA|HbbTV/i.test(navigator.userAgent);
var traceId = Math.random().toString(36).slice(2, 8), traceBuf = [];
function trace(m) {
  if (!TRACE) return;
  traceBuf.push((serverNow() % 1000000 / 1000).toFixed(2) + ' ' + m);
  if (traceBuf.length > 400) traceBuf.shift();
}
function flushTrace() {
  if (!TRACE || !traceBuf.length) return;
  var lines = traceBuf; traceBuf = [];
  fetch('/api/trace', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: traceId, ua: navigator.userAgent, lines: lines})}).catch(function () {});
}
if (TRACE) {
  setInterval(flushTrace, 3000);
  ['play', 'pause', 'playing', 'waiting', 'stalled', 'seeking', 'seeked', 'ended', 'error', 'ratechange', 'loadedmetadata', 'canplay', 'emptied'].forEach(function (ev) {
    video.addEventListener(ev, function () {
      trace('evt ' + ev + ' ct=' + video.currentTime.toFixed(3) + ' rs=' + video.readyState + (ev === 'ratechange' ? ' rate=' + video.playbackRate : '') + (ev === 'error' && video.error ? ' code=' + video.error.code : ''));
    });
  });
  var ctSeen = [];
  setInterval(function () {
    var t = target();
    var distinct = {}; ctSeen.forEach(function (c) { distinct[c] = 1; });
    trace('ct=' + video.currentTime.toFixed(3) + (t.pos !== undefined ? ' pos=' + t.pos.toFixed(3) + ' drift=' + (wrapDrift(video.currentTime - t.pos) * 1000).toFixed(0) : ' ' + t.state) +
      ' rs=' + video.readyState + ' paused=' + video.paused + ' seeking=' + video.seeking + ' rate=' + video.playbackRate +
      ' ctUpdates/s=' + Object.keys(distinct).length + ' hold=' + holding + ' step=' + stepping);
    ctSeen = [];
  }, 1000);
  setInterval(function () { ctSeen.push(video.currentTime.toFixed(3)); }, 100);
}

// --- schedule changes -----------------------------------------------------
function apply(s) {
  if (s.version === version) return;
  var was = intermission;
  version = s.version;
  schedule = s.schedule;
  intermission = s.intermission_since_ms;
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  resetController();
  // The film stays in the element across an intermission: it pauses under
  // the card and resumes from the same frame, with no reload and no black.
  // Only a different file is loaded.
  var want = schedule ? schedule.file : null;
  if (want !== loadedFile) {
    loadedFile = want;
    duration = NaN; loadError = false; loadErrors = 0;
    if (want) {
      video.src = '/media/' + encodeURIComponent(want);
      video.loop = schedule.loop;   // the element wraps by itself; we only correct
      video.load();
    } else {
      video.removeAttribute('src');
      video.load();
    }
  } else if (schedule) {
    video.loop = schedule.loop;
  }
  if (intermission && !was) {
    trace('intermission: pausing at ' + video.currentTime.toFixed(3));
    video.pause();
    music.currentTime = 0;
    fadeInMusic();
  } else if (!intermission && was) {
    trace('intermission over: resuming');
    fadeOutMusic();
  }
  tick();   // now, not at the next tick
}

// The music fades in as the card appears and out under the resuming film
// rather than cutting. iOS Safari ignores writes to volume -- there a fade
// out would be seconds of full-volume music over the film, so it cuts.
var FADE_MS = 2500, fadeTimer = null;
function stopFade() { if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; } }
function volumeWritable() { music.volume = 0.5; var ok = music.volume === 0.5; music.volume = 1; return ok; }
function fade(from, to, done) {
  stopFade();
  if (!volumeWritable()) { done(); return; }
  var t0 = Date.now();
  music.volume = from;
  fadeTimer = setInterval(function () {
    var k = Math.min(1, (Date.now() - t0) / FADE_MS);
    // Ease: a fade in rises gently at first, a fade out drops quickly at
    // first -- both spend their time at the quiet end, where the ear is.
    var e = to > from ? k * k : 1 - (1 - k) * (1 - k);
    music.volume = from + (to - from) * e;
    if (k >= 1) { stopFade(); done(); }
  }, 50);
}
function fadeInMusic() { fade(0, 1, function () { music.volume = 1; }); }
function fadeOutMusic() {
  if (music.paused) { stopFade(); return; }
  fade(music.volume, 0, function () { music.pause(); music.volume = 1; });
}

video.addEventListener('loadedmetadata', function () { duration = video.duration; loadErrors = 0; });

// A media error is usually a blip -- the server restarting, the network
// dropping -- and a page that gives up on it strands the viewer until they
// reload. So reload the element ourselves, backing off, and only call the
// file unplayable after it has failed several times in a row.
var loadErrors = 0, retryTimer = null;
video.addEventListener('error', function () {
  loadError = true; loadErrors++;
  trace('media error code=' + (video.error && video.error.code) + ' attempt ' + loadErrors);
  if (retryTimer) clearTimeout(retryTimer);
  retryTimer = setTimeout(function () {
    retryTimer = null;
    if (!schedule) return;
    loadError = false; duration = NaN;
    resetController();
    video.src = '/media/' + encodeURIComponent(schedule.file) + '?r=' + loadErrors;
    video.load();
  }, Math.min(30000, 2000 * Math.pow(2, loadErrors - 1)));
});

var es = new EventSource('/api/events');
es.addEventListener('state', function (e) { apply(JSON.parse(e.data)); });

// --- playback: getting it started -----------------------------------------
// The user's gesture is needed once for unmuted playback. We try muted
// autoplay first; if even that is refused we show a Join button.
var needGesture = false, playPending = false;

function ensurePlaying() {
  if (!video.paused || playPending || needGesture || holding) return;
  playPending = true;
  video.play().then(function () { playPending = false; })
    .catch(function () {
      playPending = false;
      if (!video.muted) { video.muted = true; ensurePlaying(); }   // retry muted
      else needGesture = true;
    });
}
$('join').onclick = function () {
  needGesture = false; video.muted = false; music.muted = false;
  if (intermission) { stopFade(); music.volume = 1; music.play().catch(function () {}); } else video.play().catch(function () {});
};
$('unmute').onclick = function () { video.muted = false; music.muted = false; };

var musicPending = false;
function ensureMusic() {
  if (!music.paused || musicPending || needGesture || !music.src) return;
  musicPending = true;
  music.muted = video.muted;
  music.play().then(function () { musicPending = false; })
    .catch(function () {
      musicPending = false;
      if (!music.muted) { music.muted = true; ensureMusic(); }   // retry muted
      else needGesture = true;
    });
}

// --- fullscreen -----------------------------------------------------------
// The whole page, not the element, so the buttons and HUD stay reachable.
// iPhone Safari has no page fullscreen; the video's own is the fallback.
function toggleFullscreen() {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
}
$('fullscreen').onclick = toggleFullscreen;
video.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', function () {
  $('fullscreen').textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  poke();
});

// In fullscreen, hide the controls and cursor after 3 s without the mouse
// moving. In a window they stay: a vanishing cursor there is a bug report.
var idleTimer;
function poke() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function () { if (document.fullscreenElement) document.body.classList.add('idle'); }, 3000);
}
['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(function (ev) { document.addEventListener(ev, poke, {passive: true}); });
poke();

// --- playback: staying in sync --------------------------------------------
// Where the schedule says we should be right now.
function target() {
  if (intermission) return {state: 'intermission'};
  if (!schedule) return {state: 'idle'};
  var t = (serverNow() - schedule.start_ms) / 1000;
  if (t < 0) return {state: 'waiting', in: -t};
  if (loadError) return {state: 'error'};
  if (isNaN(duration)) return {state: 'loading'};
  if (schedule.loop) return {state: 'playing', pos: t % duration};
  if (t >= duration) return {state: 'ended'};
  return {state: 'playing', pos: t};
}

// Drift with the shortest way round the loop, so the wrap does not read as
// a whole-duration error.
function wrapDrift(d) {
  if (!schedule.loop || !duration) return d;
  return ((d + duration / 2) % duration + duration) % duration - duration / 2;
}

// Players differ in what they let us do. A desktop browser seeks to the
// exact frame and honours playbackRate. A TV browser (Samsung's among
// them) tends to land a seek on the nearest keyframe, take a while to get
// there, report currentTime in coarse steps, and quietly ignore
// playbackRate. Corrected naively that is a picture that hops: every seek
// lands somewhere else, so every tick seeks again.
//
// So every correction is checked for whether it worked. A seek that lands
// ahead of where we should be is *held*: the picture pauses on that frame
// and resumes the instant the schedule catches up, which is exact on any
// player. A seek that lands behind is stepped forward, in doubling steps,
// until one lands ahead and can be held. A rate that the player ignores is
// never set again.
var SEEK_ABOVE = 0.5;        // s: raw drift beyond which we seek...
var SEEK_ONLY_ABOVE = 0.75;  // s: ...or this much, on a player that can only seek
var SEEK_COOLDOWN = 3000;    // ms: ...but never more often than this
var KEYFRAME_TOL = 1.0;      // s: on a keyframe-seeking player, live with this much
var HOLD_ABOVE = 0.15;       // s: landed this far ahead -> pause and wait
var NUDGE_ABOVE = 0.08;      // s: smoothed drift beyond which we bend the rate
var NUDGE_RELEASE = 0.03;    // s: ...and below which we let it go
var MAX_NUDGE = 0.08;        // ±8 % speed
var RATE_STEP = 0.02;        // rates are quantised and held, not re-set every tick
var RATE_HOLD = 2000;        // ms
var MAX_STEPS = 5;           // forward steps before accepting a landing behind

// Samsung's browser is known: a rate change flushes the decoder to the
// next keyframe, and so does resuming from a pause (seen in its trace,
// 2026-09-20). Other players are found out the same way, at run time.
var SAMSUNG = /Tizen|SMART-TV|SamsungBrowser/i.test(navigator.userAgent);

var seeks = 0, holds = 0, lastDrift = 0, smooth = null, backoff = 0;
var keyframeMode, lastSeekAt, seekTarget, seekIssuedAt, seekErr, seekLatency, stepping;
var holding, playIssuedAt, playLatency, holdWorks, resumeTimer = null;
var stall, settle;   // the clock's stall after a seek or resume, and the pending measurement of it
var rateWorks, rateValue, rateSetAt, rateProbe, rateFlushes;

function resetController() {
  keyframeMode = false; lastSeekAt = -Infinity; seekTarget = NaN; seekIssuedAt = 0;
  seekErr = NaN; seekLatency = 0; stepping = 0; smooth = null;
  holding = false; playIssuedAt = 0; playLatency = 0; stall = 0; settle = null; backoff = 0;
  if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
  holdWorks = SAMSUNG ? false : null;
  rateWorks = SAMSUNG ? false : null; rateValue = 1; rateSetAt = 0; rateProbe = null; rateFlushes = 0;
}
resetController();

function seekTo(pos) {
  var now = Date.now();
  lastSeekAt = seekIssuedAt = now; seekTarget = pos;
  rateProbe = null; smooth = null;
  if (rateValue !== 1) { video.playbackRate = 1; rateValue = 1; rateSetAt = now; }
  // Aim ahead by the latency the last seeks showed, and by a doubling step
  // while we are hunting for a keyframe past the target.
  var aim = pos + seekLatency + stall + (stepping ? 0.5 * Math.pow(2, stepping - 1) : 0);
  if (schedule.loop && duration) aim = aim % duration;
  video.currentTime = aim;
  seeks++;
  trace('seek pos=' + pos.toFixed(3) + ' aim=' + aim.toFixed(3) + ' step=' + stepping + ' lat=' + seekLatency.toFixed(3) + ' stall=' + stall.toFixed(3));
}

// Where did the seek land, relative to where we should be *now*?
video.addEventListener('seeked', function () {
  if (isNaN(seekTarget)) return;                 // the element's own loop wrap
  var t = target(); if (t.state !== 'playing') return;
  var now = Date.now();
  var lat = (now - seekIssuedAt) / 1000;
  seekLatency = Math.min(5, seekLatency === 0 ? lat : seekLatency * 0.7 + lat * 0.3);
  seekErr = wrapDrift(video.currentTime - t.pos);
  seekTarget = NaN;
  trace('landed ct=' + video.currentTime.toFixed(3) + ' pos=' + t.pos.toFixed(3) + ' err=' + seekErr.toFixed(3) + ' after=' + lat.toFixed(3) + 's');
  // The seek aimed ahead by the stall on purpose; that lead is not an
  // error, the stall is about to consume it. Hold only beyond it, and only
  // on a player whose resume does not itself jump.
  if (holdWorks !== false && seekErr > stall + HOLD_ABOVE) {
    // Ahead: freeze here and let the schedule arrive.
    holding = true; holds++; stepping = 0;
    video.pause();
    trace('hold at ct=' + video.currentTime.toFixed(3));
  } else if (seekErr < -SEEK_ABOVE) {
    // Behind, and by more than a seek should miss: a keyframe player. Ask
    // for a point further ahead until a landing is ahead of the target.
    keyframeMode = true;
    if (stepping < MAX_STEPS) { stepping++; seekTo(t.pos); }
    else stepping = 0;
  } else {
    stepping = 0;
    settle = {wall: now, drift: seekErr};
  }
});

// A player that restarts from the next keyframe on play() cannot hold:
// the clock jumps on resume. Seen once, holds are over for this file.
video.addEventListener('playing', function () {
  if (!playIssuedAt || holdWorks === false) return;
  var elapsed = (Date.now() - playIssuedAt) / 1000;
  if (video.currentTime - resumedAt > elapsed + 0.3) {
    holdWorks = false;
    trace('resume jumped ' + resumedAt.toFixed(3) + ' -> ' + video.currentTime.toFixed(3) + '; no more holds');
  }
});
var resumedAt = 0;

// After a seek or a resume the clock lands, then stalls while the decoder
// spins up, then runs. Whatever it lost is measured once it is running and
// aimed for the next time.
function checkSettle(raw) {
  if (!settle) return;
  var now = Date.now();
  if (now - settle.wall < 1500) return;
  var lost = Math.max(0, Math.min(2, settle.drift - raw));
  stall = stall === 0 ? lost : stall * 0.7 + lost * 0.3;
  settle = null;
  // Settled within tolerance: the next seek, whenever it comes, need not
  // wait longer than usual. Not: wait longer each time, so a player whose
  // stall varies from seek to seek converges on seeking rarely.
  if (Math.abs(raw) < SEEK_ABOVE) backoff = 0;
  trace('settled: lost ' + lost.toFixed(3) + ' -> stall ' + stall.toFixed(3) + ' drift now ' + raw.toFixed(3) + ' backoff ' + backoff);
}

// Resume a hold: the schedule has reached the frame we are paused on.
// play() takes a moment before the clock moves -- and the `playing` event
// fires before it does, so the latency is measured as the time until
// currentTime itself advances -- and the next resume is that much early.
var playPoll = null;
function watchResume(ct0) {
  if (playPoll) clearInterval(playPoll);
  playPoll = setInterval(function () {
    // Not the first tick of the clock -- some players tick once and then
    // stall while the decoder spins up -- but the point at which it has
    // clearly been running.
    var elapsed = (Date.now() - playIssuedAt) / 1000, moved = video.currentTime - ct0;
    if (moved >= 0.1) {
      var lat = Math.max(0, elapsed - moved);
      playLatency = Math.min(2, playLatency === 0 ? lat : playLatency * 0.7 + lat * 0.3);
    } else if (elapsed < 3) return;
    clearInterval(playPoll); playPoll = null; playIssuedAt = 0;
  }, 20);
}
function checkHold(pos) {
  // Resume at the moment, not at the next 250 ms tick.
  var wait = (wrapDrift(video.currentTime - pos) - playLatency - stall) * 1000;
  if (wait > 250 || resumeTimer) return;
  resumeTimer = setTimeout(resume, Math.max(0, wait));
}
function resume() {
  resumeTimer = null;
  if (!holding) return;
  var pos = target().pos;
  holding = false;
  // The first hold resumes blind to how long play() takes; once that is
  // measured, one more hold is allowed to take the residual out. One, so
  // a jittery player cannot be made to freeze every few seconds.
  resumedAt = video.currentTime;
  trace('resume ct=' + video.currentTime.toFixed(3) + ' pos=' + pos.toFixed(3) + ' playLat=' + playLatency.toFixed(3) + ' stall=' + stall.toFixed(3));
  playIssuedAt = Date.now();
  video.play().catch(function () {});
  watchResume(video.currentTime);
  settle = {wall: playIssuedAt, drift: wrapDrift(video.currentTime - target().pos)};
}

function setRate(want) {
  var now = Date.now();
  if (want === rateValue || now - rateSetAt < RATE_HOLD) return;
  video.playbackRate = want;
  rateValue = want; rateSetAt = now;
  trace('rate set ' + want);
  // A player that flushes on a rate change says so with `waiting` at once.
  // Twice, before believing it: a `waiting` can also be plain buffering
  // that happened to land there, and a desktop wrongly written off is a
  // desktop corrected by seeks alone.
  var onWaiting = function () {
    video.removeEventListener('waiting', onWaiting);
    if (Date.now() - rateSetAt < 400 && rateWorks !== false) {
      rateFlushes++;
      trace('waiting right after a rate change (' + rateFlushes + ')');
      if (rateFlushes >= 2) {
        rateWorks = false; rateProbe = null;
        trace('player flushes on rate changes; rate is off');
        if (rateValue !== 1) { video.playbackRate = 1; rateValue = 1; }
      }
    }
  };
  video.addEventListener('waiting', onWaiting);
  setTimeout(function () { video.removeEventListener('waiting', onWaiting); }, 500);
  // Prove it took: after two seconds at this rate the clock should have
  // advanced at it. A player that ignores the rate advances at 1.0.
  rateProbe = want === 1 ? null : {wall: now, ct: video.currentTime, rate: want};
}
function checkRateProbe() {
  if (!rateProbe || video.seeking) return;
  var now = Date.now();
  if (now - rateProbe.wall < 2000) return;
  var measured = (video.currentTime - rateProbe.ct) / ((now - rateProbe.wall) / 1000);
  rateProbe = null;
  if (measured < 0) return;                                  // wrapped; inconclusive
  if (Math.abs(measured - rateValue) < 0.03) rateWorks = true;
  else if (Math.abs(measured - 1) < 0.02) rateWorks = false; // ignored
  trace('rate probe: asked ' + rateValue + ' measured ' + measured.toFixed(3) + ' -> ' + rateWorks);
}

function correct(pos) {
  if (holding) { checkHold(pos); return; }
  // A seek whose `seeked` never comes (some TV players) would wait forever.
  if (!isNaN(seekTarget) && Date.now() - seekIssuedAt > 5000) {
    trace('no seeked event in 5 s; treating as landed');
    seekTarget = NaN; stepping = 0;
  }
  if (stepping || video.seeking || video.readyState < 2) return;
  var raw = wrapDrift(video.currentTime - pos);            // + means ahead
  lastDrift = raw;
  smooth = smooth === null ? raw : smooth + (raw - smooth) * 0.3;
  var now = Date.now();
  checkRateProbe();
  checkSettle(raw);

  // A player that can only seek pays a visible stall for every correction,
  // so it is allowed a little more slack than one that can nudge silently.
  var threshold = keyframeMode ? KEYFRAME_TOL : rateWorks === false ? SEEK_ONLY_ABOVE : SEEK_ABOVE;
  // Both the sample and the average: a player that reports currentTime in
  // coarse steps produces single samples a step off, and a seek on one of
  // those is a hop for nothing. And not while the last seek is still
  // settling, nor sooner than the backoff allows.
  var cooldown = Math.min(30000, SEEK_COOLDOWN * Math.pow(2, backoff));
  if (!settle && Math.abs(raw) > threshold && Math.abs(smooth) > threshold && now - lastSeekAt > cooldown) {
    stepping = 0; backoff++;
    seekTo(pos);
    return;
  }
  if (rateWorks === false) { if (rateValue !== 1) setRate(1); return; }
  if (settle) return;                  // no rate change on a clock that is still stalling
  var want = rateValue;
  if (Math.abs(smooth) > NUDGE_ABOVE) {
    var n = Math.max(-MAX_NUDGE, Math.min(MAX_NUDGE, smooth));
    want = 1 - Math.round(n / RATE_STEP) * RATE_STEP;
  } else if (Math.abs(smooth) < NUDGE_RELEASE) {
    want = 1;
  }
  setRate(+want.toFixed(2));
}

function tick() {
  var t = target();
  var hud = '';
  if (t.state !== 'intermission') {
    if (!$('intermission').classList.contains('hidden')) $('intermission').classList.add('hidden');
    if (!music.paused && !fadeTimer) music.pause();
  }
  switch (t.state) {
    case 'idle':    pause(); show('Nothing scheduled', ''); break;
    case 'waiting': pause(); show('Starting in ' + fmt(t.in), ''); break;
    case 'loading': pause(); show('Loading…', ''); break;
    case 'error':
      pause();
      if (loadErrors < 4) show('Reconnecting…', '');
      else show('Cannot play this file', 'Is it H.264/AAC MP4 or WebM? (still retrying)');
      break;
    case 'ended':   pause(); show('Stream ended', ''); break;
    case 'intermission':
      pause();
      ensureMusic();
      if ($('intermission').classList.contains('hidden')) $('intermission').classList.remove('hidden');
      if (needGesture) show("We'll be right back", 'Tap for sound', true); else hide();
      hud = 'intermission ' + fmt((serverNow() - intermission) / 1000) + (music.paused ? '  (music not playing)' : '') + '\n';
      break;
    case 'playing':
      ensurePlaying();
      if (needGesture) { show('Live', '', true); break; }
      hide();
      correct(t.pos);
      hud = fmt(t.pos) + ' / ' + fmt(duration) + (schedule.loop ? ' ↻' : '') +
        (holding ? '  HOLDING ' + ms(wrapDrift(video.currentTime - t.pos)) : '  drift ' + ms(lastDrift) + ' (avg ' + ms(smooth || 0) + ')') +
        '  rate ' + rateValue.toFixed(2) + (rateWorks === null ? ' ?' : rateWorks ? ' ok' : ' ignored') +
        '  seeks ' + seeks + ' holds ' + holds + (isNaN(seekErr) ? '' : ' landed ' + ms(seekErr) + ' off, ' + (seekLatency * 1000).toFixed(0) + 'ms late, stall ' + (stall * 1000).toFixed(0) + 'ms') +
        (keyframeMode ? '  keyframe player' : '') + (holdWorks === false ? '  no holds' : '') + (backoff ? '  backoff ' + backoff : '') + '\n';
      break;
  }
  $('unmute').classList.toggle('hidden', !((t.state === 'playing' && video.muted || t.state === 'intermission' && music.muted) && !needGesture));
  $('hud').textContent = hud + 'clock offset ' + offset.toFixed(0) + 'ms  rtt ' + (isNaN(offsetRtt) ? '?' : offsetRtt + 'ms') +
    '  ' + ua();
}

function pause() { if (!video.paused) video.pause(); }
function show(title, sub, join) {
  $('overlay').classList.remove('hidden');
  $('title').textContent = title; $('sub').textContent = sub || '';
  $('join').classList.toggle('hidden', !join);
}
function hide() { $('overlay').classList.add('hidden'); }
function ms(s) { var v = (s * 1000).toFixed(0) + 'ms'; while (v.length < 7) v = ' ' + v; return v; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmt(s) {
  s = Math.max(0, Math.floor(s));
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? h + ':' + pad2(m) + ':' + pad2(sec) : m + ':' + pad2(sec);
}
// Enough of the user agent to tell a TV from a laptop in a photo of the HUD.
function ua() {
  var u = navigator.userAgent, m = /(SMART-TV|Tizen[^;)]*|SmartTV|Web0S|Chrome\/\d+|Safari\/\d+|Firefox\/\d+)/i.exec(u);
  return m ? m[1] : '';
}

syncClock();
setInterval(syncClock, 30000);
setInterval(tick, 250);
</script>
